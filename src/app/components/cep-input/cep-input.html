
<section class="cep">
  <div class="inputs">
<div class="input-cep">
<input type="text" placeholder="cep" [(ngModel)]="cep" class="input-box">
</div>

<div class="button-div">
<button class="button" (click)="getCep()" type="button">Buscar</button>
</div>
</div>

<div class="info">
  <p>Rua: {{endereco.logradouro}}</p>
  <p>Bairro: {{endereco.bairro}}</p>
  <p>Cidade: {{endereco.uf}}</p>
  <p>Estado: {{endereco.estado}}</p>
</div>
</section>
